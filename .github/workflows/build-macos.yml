name: Build Shensi 0.0.53 for macOS
run-name: Shensi 0.0.53 macOS packages
on:
  workflow_dispatch:
  push:
    branches: [codex/desktop-049-20261123]
    paths: [".github/workflows/build-macos.yml", "packaging/macos/**"]
permissions:
  contents: read
concurrency:
  group: shensi-macos-0.0.53
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      SHENSI_TEST_HONGGUO_FIXTURE: 'villain'
      SHENSI_TEST_HONGGUO_SHARE_URL: 'https://novelquickapp.com/s/yDbLcIG8yxg/'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GH_TOKEN: ${{ github.token }}
      WORK: build/macos-release
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recover verified public application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/download" "$WORK/extracted"
          gh release download v0.0.41 --repo wu798998264-crypto/shensi-notes --pattern Shensi-Setup-0.0.41-20261116162447347-x64.exe --dir "$WORK/download"
          echo "b151f634f228857911db17b85a9d9e29552bf11bdbdd26b948d6e2fda3b4cc2c  $WORK/download/Shensi-Setup-0.0.41-20261116162447347-x64.exe" | shasum -a 256 -c -
          sevenzip="$(command -v 7zz || command -v 7z)"
          "$sevenzip" e "$WORK/download/Shensi-Setup-0.0.41-20261116162447347-x64.exe" "-o$WORK/download" '*app-64.7z' -r -y
          "$sevenzip" x "$WORK/download/app-64.7z" "-o$WORK/extracted" 'resources/app/*' -y
          curl -fLsS --retry 3 'https://github.com/wu798998264-crypto/shensi-plugins/releases/download/plugin-thirdparty.doubao-v0.1.34/thirdparty.doubao-0.1.34.plugin.json' -o "$WORK/doubao.plugin.json"
          echo "d1018a38d240f168a8c81890998e30d5bee7c4dce05609eb24ed99ed4dd48b05  $WORK/doubao.plugin.json" | shasum -a 256 -c -
      - name: Prepare macOS application and native tools
        run: |
          node packaging/macos/prepare-release.mjs "$WORK/extracted/resources/app" "$WORK" "$ARCH"
          cp packaging/macos/extensions/catalog.json "$WORK/app/resources/plugins/public-extension-catalog.json"
          bash packaging/macos/prepare-runtime.sh "$WORK" "$ARCH"
      - name: Create application icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mac/icon.iconset
          "$WORK/runtime/chushou-runtime/bin/python3" -I -B -c "import sys,runpy;sys.path.insert(0,'$WORK/runtime/chushou-runtime/packages');sys.argv=['prepare-icon.py','$WORK/app/packages/ui/logo.png','build/mac/dock-icon.png'];runpy.run_path('packaging/macos/prepare-icon.py',run_name='__main__')"
          source="build/mac/dock-icon.png"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$source" --out "build/mac/icon.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" "$source" --out "build/mac/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/mac/icon.iconset -o build/mac/icon.icns
      - name: Build signed DMG and ZIP
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config "$WORK/builder.json"
      - name: Verify actual macOS application
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$WORK/dist-$ARCH" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          hdiutil verify "$WORK/dist-$ARCH/Shensi-0.0.53-$ARCH.dmg"
          node packaging/macos/after-sign.cjs "$app" "$ARCH"
          (cd "$WORK/dist-$ARCH" && shasum -a 256 "Shensi-0.0.53-$ARCH.dmg" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          compression-level: 0
          path: |
            build/macos-release/dist-${{ matrix.arch }}/Shensi-*.dmg
            build/macos-release/dist-${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error
      - name: Verify text card exports and novel references
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$WORK/dist-$ARCH" -maxdepth 2 -name '*.app' -print -quit)"
          SHENSI_TEST_PACKAGE_ROOT="$app/Contents/Resources/app" SHENSI_TEST_EVIDENCE="build/ui-$ARCH/card-export-service" node scripts/test-card-export-novel.mjs
      - name: Verify real short-drama download and whiteboard handoff
        shell: bash
        env:
          SHENSI_TEST_HONGGUO_FIXTURE: villain
          SHENSI_TEST_HONGGUO_SHARE_URL: 'https://novelquickapp.com/hongguo/ug/pages/video-list-share-ssr?video_series_id=7704683516834892825&vid=7704685770241477657'
        run: |
          set -euo pipefail
          app="$(find "$WORK/dist-$ARCH" -maxdepth 2 -name '*.app' -print -quit)"
          node scripts/verify-guoapp-real.mjs "$app/Contents/Resources/app" "build/guoapp-$ARCH" "$app/Contents/Resources"
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}
          path: |
            build/mac-verification-*.json
            build/mac-ui-*.png
            build/ui-*/**/*
            build/mac/dock-icon.png
            build/macos-release/adaptations.json
            build/guoapp-*/*.json
          if-no-files-found: warn
