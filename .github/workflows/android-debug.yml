name: Android debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Build and sync native resources
        working-directory: apps/mobile
        run: npm run sync:android
      - name: Verify shared document contracts
        run: node scripts/test-mobile-document-store.mjs
      - name: Restore persistent test-only signing identity
        env:
          TEST_KEYSTORE: ${{ secrets.SHENSI_ANDROID_TEST_KEYSTORE }}
        run: |
          test -n "$TEST_KEYSTORE"
          printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/shensi-mobile-test.jks"
          chmod 600 "$RUNNER_TEMP/shensi-mobile-test.jks"
      - name: Build debug APK and Java unit tests
        working-directory: apps/mobile/android
        env:
          SHENSI_TEST_KEYSTORE: ${{ runner.temp }}/shensi-mobile-test.jks
        run: bash gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Public backend connectivity report
        continue-on-error: true
        run: node scripts/probe-mobile-backend-readiness.mjs public-readiness.json
      - name: Verify APK identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > apk-identity.txt
      - name: Hash APK
        run: sha256sum apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shensi-mobile-debug
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-signature.txt
            apk-identity.txt
            public-readiness.json
          retention-days: 14
