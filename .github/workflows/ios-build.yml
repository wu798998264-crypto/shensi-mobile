name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [codex/latest-packages-20261120-13]
    paths: [".github/workflows/ios-build.yml", "apps/mobile/ios/**", "apps/mobile/ios-sign.sh"]
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare current native app
        working-directory: apps/mobile
        run: |
          npm ci
          npm run build
          npx --no-install cap sync ios
          (cd ../.. && node scripts/test-mobile-foundation-package.mjs)
        shell: bash
      - name: Build simulator app
        working-directory: apps/mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild -scheme App -project App.xcodeproj -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-sim" build > "$RUNNER_TEMP/sim-build.log" || { grep -E '(error:|fatal error:)' "$RUNNER_TEMP/sim-build.log"; exit 1; }
      - name: Launch and verify persistent notebook and system Keychain
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | jq -er '[.devices | to_entries[] | select(.key|contains("iOS")) | .value[] | select(.name|startswith("iPhone"))][0].udid')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/ios-sim/Build/Products/Debug-iphonesimulator/App.app"
          id=studio.hexing.shensi.mobile
          for expected in created reopened; do
            xcrun simctl launch --stdout="$RUNNER_TEMP/iphone-out" --stderr="$RUNNER_TEMP/iphone-err" "$device" "$id" --verify-local-library
            marker="$(xcrun simctl get_app_container "$device" "$id" data)/tmp/shensi-smoke-$expected"
            for i in {1..90}; do [ -f "$marker" ] && break; sleep 1; done
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/iphone-$expected.png"
            if [ ! -f "$marker" ]; then
              cat "$RUNNER_TEMP/iphone-err" "$(dirname "$marker")/smoke-error" 2>/dev/null || true
              find "$HOME/Library/Logs/DiagnosticReports" -name 'App-*.ips' -maxdepth 2 -exec cp {} "$RUNNER_TEMP/iphone-crash.ips" \; || true
              xcrun simctl spawn "$device" log show --last 4m --style compact --predicate 'process == "App" AND messageType == error' | tail -35 || true
              exit 1
            fi
            test "$(cat "$marker")" = "$expected"
            xcrun simctl terminate "$device" "$id"
          done
      - name: Export signed Ad Hoc installer
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: bash apps/mobile/ios-sign.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shensi-iphone-13
          path: |
            ${{ runner.temp }}/iphone-*.png
            ${{ runner.temp }}/iphone-crash.ips
            ${{ runner.temp }}/shensi-iphone/*.ipa
            ${{ runner.temp }}/shensi-iphone/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
