name: Verify delivered Android APK
on:
  push:
    branches: [codex/latest-packages-20261120-13]
    paths: [".github/workflows/android-install.yml"]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shensi-mobile-foundation
          run-id: 44693040746
          github-token: ${{ github.token }}
          path: received
      - name: Launch delivered application on clean Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          apk=received/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          echo "1a963ec5a3e3928731b5a9b1a5c875f15393bca973f2313199b41023ee30f432  $apk" | sha256sum -c -
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager "emulator" "$image" >/dev/null
          echo no | avdmanager create avd -n shensi -k "$image" -d pixel_6
          emulator -avd shensi -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -partition-size 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'tail -60 "$RUNNER_TEMP/emulator.log" || true' ERR
          sleep 4
          kill -0 "$emulator_pid"
          timeout 150 adb wait-for-device
          for n in {1..120}; do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell wm dismiss-keyguard
          adb install "$apk"
          id=studio.hexing.shensi.mobile.test
          activity=$(adb shell cmd package resolve-activity --brief "$id" | tail -1 | tr -d '\r')
          adb shell am start -W -n "$activity"
          control() {
            for n in {1..15}; do
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null
              adb pull /sdcard/ui.xml "evidence/$1.xml" >/dev/null
              point=$(python3 - "$1" "$2" <<'PY'
          from pathlib import Path
          import re,sys,xml.etree.ElementTree as ET
          for node in ET.parse(Path('evidence')/(sys.argv[1]+'.xml')).iter('node'):
              if sys.argv[2] not in (node.get('text'),node.get('content-desc')):
                  continue
              x,y,r,b=map(int,re.findall(r'-?\d+',node.attrib['bounds']))
              if r>x and b>y:
                  print((x+r)//2,(y+b)//2)
                  break
          PY
              )
              if [[ -n "$point" ]]; then
                if [[ "${3:-}" = tap ]]; then adb shell input tap $point; fi
                return 0
              fi
              sleep 1
            done
            return 1
          }
          control home '新建笔记本'
          adb exec-out screencap -p > evidence/android-home.png
          control home '新建笔记本' tap
          control dialog '创建'
          adb shell input text AndroidValidation13
          if adb shell dumpsys input_method | grep 'mInputShown=true' >/dev/null; then adb shell input keyevent 4; fi
          control create '创建' tap
          control created AndroidValidation13
          adb shell am force-stop "$id"
          adb shell am start -W -n "$activity"
          control reopened AndroidValidation13
          adb exec-out screencap -p > evidence/android-reopened.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-installed-evidence
          path: evidence
          retention-days: 14
