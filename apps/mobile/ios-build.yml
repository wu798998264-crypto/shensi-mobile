name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [codex/latest-packages-20261120-13]
    paths: [".github/workflows/ios-build.yml", "apps/mobile/ios/**", "apps/mobile/ios-sign.sh"]
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare current native app
        working-directory: apps/mobile
        run: |
          npm ci
          npm run build
          npx --no-install cap sync ios
          (cd ../.. && node scripts/test-mobile-foundation-package.mjs)
        shell: bash
      - name: Build simulator app
        working-directory: apps/mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild -scheme App -project App.xcodeproj -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-sim" build > "$RUNNER_TEMP/sim-build.log" || { grep -E '(error:|fatal error:)' "$RUNNER_TEMP/sim-build.log"; exit 1; }
      - name: Launch and verify persistent notebook and system Keychain
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes -j | jq -er '[.runtimes[] | select(.isAvailable and (.name|startswith("iOS")))] | sort_by(.version|split(".")|map(tonumber)) | last.identifier')
          device=$(xcrun simctl create ShensiValidation com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          echo "Testing $runtime on a clean iPhone 16"
          collect_failure() {
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/iphone-failure.png" || true
            container=$(xcrun simctl get_app_container "$device" studio.hexing.shensi.mobile data) || return 0
            cat "$container/tmp/smoke-error" 2>/dev/null || true
            find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/$device/data/Library/Logs" -type f -name 'App-*.ips' -exec cp {} "$RUNNER_TEMP/iphone-crash.ips" \; 2>/dev/null || true
            xcrun simctl spawn "$device" log show --last 10m --style compact --predicate 'process == "App" OR ((process == "SpringBoard" OR process == "runningboardd") AND eventMessage CONTAINS[c] "studio.hexing.shensi.mobile")' 2>/dev/null | tail -120 > "$RUNNER_TEMP/iphone-launch.log" || true
          }
          trap collect_failure ERR
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/ios-sim/Build/Products/Debug-iphonesimulator/App.app"
          id=studio.hexing.shensi.mobile
          for expected in created reopened; do
            xcrun simctl launch "$device" "$id" --verify-local-library
            marker="$(xcrun simctl get_app_container "$device" "$id" data)/tmp/shensi-smoke-$expected"
            for i in {1..90}; do [ -f "$marker" ] && break; sleep 1; done
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/iphone-$expected.png"
            test -f "$marker"
            test "$(cat "$marker")" = "$expected"
            xcrun simctl terminate "$device" "$id"
          done
      - name: Compile release executable for physical iPhone
        working-directory: apps/mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild -scheme App -project App.xcodeproj -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/device-build.log" || { grep -E '(error:|fatal error:)' "$RUNNER_TEMP/device-build.log"; exit 1; }
          app="$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = studio.hexing.shensi.mobile
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 13
          lipo "$app/App" -verify_arch arm64
          xcrun vtool -show-build "$app/App" | grep -E 'platform IOS$'
      - name: Export signed Ad Hoc installer
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: bash apps/mobile/ios-sign.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shensi-iphone-13
          path: |
            ${{ runner.temp }}/iphone-*.png
            ${{ runner.temp }}/iphone-crash.ips
            ${{ runner.temp }}/iphone-launch.log
            ${{ runner.temp }}/shensi-iphone/*.ipa
            ${{ runner.temp }}/shensi-iphone/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
